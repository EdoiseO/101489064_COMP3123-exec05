<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Phillip Onofua — 101489064">
  <title>Lab 5 | Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f4f4f5;
      color: #18181b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 384px; }
    header { margin-bottom: 24px; text-align: center; }
    header p { margin: 0 0 8px; color: #71717a; font-size: 13px; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; line-height: 1.35; }
    .card {
      padding: 28px 24px;
      border: 1px solid #e4e4e7;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 1px 3px rgb(0 0 0 / 4%);
    }
    h2 { margin: 0 0 8px; text-align: center; font-size: 21px; font-weight: 650; }
    .description { margin: 0 0 26px; color: #71717a; font-size: 14px; line-height: 1.5; text-align: center; }
    form { display: grid; gap: 22px; }
    .field { display: grid; gap: 8px; }
    label { font-size: 14px; font-weight: 550; }
    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d4d4d8;
      border-radius: 7px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 14px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 3%);
    }
    input::placeholder { color: #a1a1aa; }
    input:focus-visible, button:focus-visible { outline: 3px solid #a1a1aa; outline-offset: 3px; }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 7px;
      background: #18181b;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 550;
      cursor: pointer;
    }
    button:hover { background: #303034; }
    button:disabled { opacity: .65; cursor: wait; }
    #result { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    #result[data-status="error"] { color: #b91c1c; }
    #result[data-status="success"] { color: #15803d; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <p>COMP3123 · Lab Exercise 5</p>
      <h1>Welcome to ExpressJs Tutorial</h1>
    </header>
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title">Login to your account</h2>
      <p class="description">Enter your username and password to sign in.</p>
      <form id="login-form" action="/api/v1/user/login" method="post" aria-describedby="result">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" placeholder="Your username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="result" role="status" aria-live="polite" hidden></p>
        <button id="login-button" type="submit">Login</button>
      </form>
    </section>
  </main>
  <script>
    // Phillip Onofua — 101489064. Plain UI for the exercise's existing login API.
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = "Signing in…";
      form.setAttribute("aria-busy", "true");
      result.hidden = true;

      try {
        const response = await fetch(form.getAttribute("action"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.elements.username.value,
            password: form.elements.password.value
          })
        });
        if (!response.ok) throw new Error("Login API unavailable");
        const data = await response.json();
        if (typeof data.status !== "boolean" || typeof data.message !== "string") {
          throw new Error("Unexpected login response");
        }
        result.textContent = data.message;
        result.dataset.status = data.status ? "success" : "error";
        if (data.status) form.elements.password.value = "";
      } catch {
        result.textContent = "Unable to sign in. Make sure the exercise login server is running.";
        result.dataset.status = "error";
      } finally {
        result.hidden = false;
        button.disabled = false;
        button.textContent = "Login";
        form.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
